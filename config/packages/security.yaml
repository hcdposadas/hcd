# config/packages/security.yaml
security:
  # 🔒 Hashers
  encoders:
    App\Entity\Usuario:
      algorithm: auto

  # 👑 Jerarquía de roles
  role_hierarchy:
    ROLE_ADMIN:       ROLE_USER
    ROLE_SUPER_ADMIN: ROLE_ADMIN
    ROLE_PROSECRETARIO_LEGISLATIVO: ROLE_LEGISLATIVO
    ROLE_RRHH_ADMIN:  ROLE_RRHH

  # 👤 Proveedores de usuario
  providers:
    app_user_provider:
      entity:
        class: App\Entity\Usuario
        property: username

  firewalls:
    # 1) Desactivar seguridad en assets y profiler
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    # 2) Sesión (login/logout “/sesion/...”)
    sesion:
      pattern: ^/sesion
      provider: app_user_provider

      form_login:
        login_path:        /sesion/login
        check_path:        /sesion/login
        default_target_path: /sesion

      logout:
        path:               /sesion/logout
        target:             /sesion
        invalidate_session: true
        delete_cookies:
          PHPSESSID:
            domain:   138.117.79.232
            path:     /
            secure:   false
            samesite: lax

      anonymous: true
      guard:
        authenticators:
          - App\Security\LoginSesionFormAuthenticator
      user_checker: App\Security\UserChecker

    # 3) Firewall general (_catch-all_) para todo lo demás
    main:
      pattern: ^/
      provider: app_user_provider

      form_login:
        login_path:        /login
        check_path:        /login
        default_target_path: /

      logout:
        path:               /logout
        target:             /
        invalidate_session: true
        delete_cookies:
          PHPSESSID:
            domain:   138.117.79.232
            path:     /
            secure:   false
            samesite: lax

      anonymous: true
      switch_user:
        role:      ROLE_ADMIN
        parameter: _want_to_be_this_user
      guard:
        authenticators:
          - App\Security\LoginFormAuthenticator
      user_checker: App\Security\UserChecker

  # 🔐 Control de acceso
  access_control:
    - { path: ^/login$,            role: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/sesion/login$,     role: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/pantalla,          role: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/pantallota,        role: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/reset-password,    role: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/mesa-entrada/expediente/expediente_imprimir_proyecto(/|$), role: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/mesa-entrada/expediente/.*/giro_imprimir_resumen_firmado_v, role: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/mesa-entrada/expediente/.*/expediente_imprimir_firmado_v, role: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/sesion/,            role: [ROLE_CONCEJAL, ROLE_SECRETARIO, ROLE_LEGISLATIVO, ROLE_DEFENSOR, ROLE_PROSECRETARIO] }
    - { path: ^/admin/,             role: ROLE_ADMIN }
    - { path: ^/api/expedientes,    role: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/ajax/get-expedientes,role: IS_AUTHENTICATED_ANONYMOUSLY }
    - { path: ^/,                   role: IS_AUTHENTICATED_FULLY }

